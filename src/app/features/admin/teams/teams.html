<div class="container mt-4">
  <h2>Manage Teams</h2>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5>Add New Team</h5>
      <form (ngSubmit)="createTeam()" class="row g-3">
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Team Name" [(ngModel)]="newTeam.teamName" name="name" required>
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control" placeholder="Code (e.g. ARG)" [(ngModel)]="newTeam.teamCode" name="code" required>
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control" placeholder="Group (e.g. C)" [(ngModel)]="newTeam.groupName" name="group" required>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Flag URL" [(ngModel)]="newTeam.flagImageUrl" name="flag">
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Add Team</button>
        </div>
      </form>
    </div>
  </div>

  <table class="table table-striped table-hover mt-3">
    <thead>
      <tr>
        <th>Flag</th>
        <th>Name</th>
        <th>Code</th>
        <th>Group</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let team of teams">
        <td><img [src]="team.flagImageUrl" width="40" alt="flag" *ngIf="team.flagImageUrl"></td>
        <td>{{ team.teamName }}</td>
        <td>{{ team.teamCode }}</td>
        <td>{{ team.groupName }}</td>
        <td>{{ team.isActive ? 'Active' : 'Inactive' }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="deleteTeam(team.teamId)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
