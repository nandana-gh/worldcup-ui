<div class="container mt-4">
  <h2>Manage Teams</h2>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5>Add New Team</h5>
      <form (ngSubmit)="createTeam()" class="row g-3">
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Team Name" [(ngModel)]="newTeam.teamName" name="name" required>
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" placeholder="Code (e.g. ARG)" [(ngModel)]="newTeam.teamCode" name="code" required>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Add Team</button>
        </div>
      </form>
    </div>
  </div>

  <table class="table table-striped table-hover mt-3">
    <thead>
      <tr>
        <th>Name</th>
        <th>Code</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let team of teams">
        <td>{{ team.teamName }}</td>
        <td>{{ team.teamCode }}</td>
        <td>{{ team.isActive ? 'Active' : 'Inactive' }}</td>
        <td>
          <button *ngIf="team.isActive" class="btn btn-sm btn-danger" (click)="deactivateTeam(team.teamId)">Deactivate</button>
          <button *ngIf="!team.isActive" class="btn btn-sm btn-success" (click)="activateTeam(team.teamId)">Reactivate</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
