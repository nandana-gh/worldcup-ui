<div class="container mt-4">
  <h2>My Vote</h2>
  <div *ngIf="errorMessage" class="alert alert-warning">{{ errorMessage }}</div>
  
  <div *ngIf="!errorMessage && !vote" class="text-center mt-5 text-muted">
    <h4>No Vote Found</h4>
    <p>You haven't voted for any team yet. Go to <a routerLink="/teams">Vote Now</a> to pick your favorite!</p>
  </div>

  <div *ngIf="vote && team" class="card mt-3 shadow-sm" style="max-width: 400px;">
    <div class="card-body text-center">
      <h3 class="card-title">{{ team.teamName }}</h3>
      <h5 class="text-muted">{{ team.teamCode }}</h5>
      <div class="alert alert-danger mt-3" *ngIf="!team.isActive">
        The team you voted for is not active at the moment
      </div>
      <p class="mt-3 text-success"><strong>Voted on:</strong> {{ vote.votedAt | date:'medium' }}</p>
    </div>
  </div>
</div>
