<div class="container mt-4">
  <h2>My Vote</h2>
  <div *ngIf="errorMessage" class="alert alert-warning">{{ errorMessage }}</div>
  
  <div *ngIf="vote && team" class="card mt-3 shadow-sm" style="max-width: 400px;">
    <img [src]="team.flagImageUrl" class="card-img-top" alt="Team Flag" *ngIf="team.flagImageUrl">
    <div class="card-body text-center">
      <h3 class="card-title">{{ team.teamName }}</h3>
      <h5 class="text-muted">{{ team.teamCode }}</h5>
      <p>Group: {{ team.groupName }}</p>
      <p class="mt-3 text-success"><strong>Voted on:</strong> {{ vote.votedAt | date:'medium' }}</p>
    </div>
  </div>
</div>
