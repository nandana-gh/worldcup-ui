<div class="container mt-4">
  <h2>Voting Results</h2>
  <div *ngIf="errorMessage" class="alert alert-warning">{{ errorMessage }}</div>
  
  <div *ngIf="!errorMessage && results.length > 0">
    <div class="card shadow-sm mb-3" *ngFor="let result of results; let i = index">
      <div class="card-body d-flex align-items-center">
        <h3 class="me-3">#{{ i + 1 }}</h3>
        <img [src]="result.flagImageUrl" alt="flag" width="60" class="me-3 rounded" *ngIf="result.flagImageUrl">
        <div class="flex-grow-1">
          <h5 class="mb-0">{{ result.teamName }} ({{ result.teamCode }})</h5>
          <small class="text-muted">{{ result.voteCount }} votes ({{ result.percentage }}%)</small>
          <div class="progress mt-2" style="height: 10px;">
            <div class="progress-bar bg-success" role="progressbar" [style.width.%]="result.percentage" [attr.aria-valuenow]="result.percentage" aria-valuemin="0" aria-valuemax="100"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
